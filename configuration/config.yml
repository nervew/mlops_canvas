inference_column: "prediction"
target_column: "label"
ingestion_columns:
  - "feature1"
  - "feature2"
  - "feature3"
thresholds:
  mean_diff: 0.1
  std_diff: 0.1
  corr: 0.5
  missing: 0.05
paths:
  output_report: "reports/inference"
  report_path: "reports/ingestion"
  requirements: "requirements.txt"
output:
  report_path: "reports/ingestion"
  databricks: "dbfs:/tmp/ingestion_report"
validator:
  strategy: "great_expectations"
databricks:
  workspace_url: "https://adb.example.com"
  token: "DATABRICKS_TOKEN"
  cluster_id: "cluster-1"
